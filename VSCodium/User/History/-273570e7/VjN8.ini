# ~/.config/foot/foot.ini

[main]
font=Comic Sans MS:size=10
dpi-aware=yes
pad=10x10

[colors]
# Wildberry theme
foreground=00ffb7
background=1a0a1e

# Regular colours
regular0=1a0a1e   # black (background)
regular1=ff5e99   # red
regular2=00ffb7   # green
regular3=ffd700   # yellow
regular4=ff77a9   # blue
regular5=d63384   # magenta
regular6=ffb1d8   # cyan
regular7=9e6b82   # white

# Bright colours
bright0=2e1a30    # bright black
bright1=ff77a9    # bright red
bright2=a3f0a0    # bright green
bright3=ffe4b5    # bright yellow
bright4=ffb1d8    # bright blue
bright5=ff5e99    # bright magenta
bright6=ffb1d8    # bright cyan
bright7=00ffb7    # bright white

# Dim colours (slightly muted versions)
dim0=1a0a12
dim1=d63384
dim2=00ffb7
dim3=ffd700
dim4=ff77a9
dim5=9e6b82
dim6=ffb1d8
dim7=9e6b82

[cursor]
color=1a0a1e d63384
style=beam

[bell]
urgent=yes
notify=yes

[mouse]
hide-when-typing=yes